name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          cache: true
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit:dependencies

      - name: Run quality gates
        run: pnpm check

  database-integration:
    name: Database integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_PORT: 33060

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          cache: true
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create ephemeral database secrets
        shell: bash
        run: |
          umask 077
          app_password_file="$RUNNER_TEMP/mysql-app-password"
          root_password_file="$RUNNER_TEMP/mysql-root-password"
          echo "DATABASE_PASSWORD_FILE=$app_password_file" >> "$GITHUB_ENV"
          echo "COMPOSE_MYSQL_APP_PASSWORD_FILE=$app_password_file" >> "$GITHUB_ENV"
          echo "MYSQL_ROOT_PASSWORD_FILE=$root_password_file" >> "$GITHUB_ENV"
          openssl rand -hex 32 > "$app_password_file"
          openssl rand -hex 32 > "$root_password_file"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start MySQL
        run: docker compose up --detach --wait --wait-timeout 120 mysql

      - name: Verify MySQL contract
        run: |
          docker compose exec -T mysql sh -euc '
            actual="$(
              MYSQL_PWD="$(cat /run/secrets/mysql_app_password)" \
                mysql --batch --skip-column-names --protocol=TCP \
                --host=127.0.0.1 --user="$MYSQL_USER" \
                --database="$MYSQL_DATABASE" \
                --execute="SELECT VERSION(), @@SESSION.transaction_isolation, @@SESSION.time_zone, @@character_set_server, @@collation_server, DATABASE();"
            )"
            expected="$(printf "8.4.11\tREAD-COMMITTED\t+00:00\tutf8mb4\tutf8mb4_0900_ai_ci\toms")"
            test "$actual" = "$expected"
          '

      - name: Validate Prisma schema
        run: pnpm db:schema:validate

      - name: Apply committed migrations
        run: pnpm db:migrate:deploy

      - name: Verify migration deployment is idempotent
        run: pnpm db:migrate:deploy

      - name: Test Prisma against MySQL
        run: pnpm test:integration:database

      - name: Test Catalog persistence against MySQL
        run: pnpm test:integration:catalog

      - name: Test API health against MySQL
        run: pnpm test:integration:api

      - name: Print MySQL logs on failure
        if: failure()
        run: docker compose logs --no-color mysql

      - name: Remove ephemeral database
        if: always()
        run: docker compose down --volumes --remove-orphans
