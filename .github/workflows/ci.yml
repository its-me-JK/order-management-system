name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          cache: true
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit:dependencies

      - name: Run repository quality gates
        run: pnpm check

  integration:
    name: MySQL, Redis, and API integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DEPLOYMENT_ENVIRONMENT: test
      DATABASE_HOST: 127.0.0.1
      DATABASE_NAME: oms
      DATABASE_PORT: 33060
      DATABASE_TLS_MODE: disabled
      DATABASE_USER: oms_app
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 63790
      REDIS_TLS_MODE: disabled
      REDIS_USERNAME: oms_app
      RABBITMQ_PORT: 56720
      RABBITMQ_MANAGEMENT_PORT: 15670

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          cache: true
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create ephemeral service secrets
        shell: bash
        run: |
          umask 077
          app_password_file="$RUNNER_TEMP/mysql-app-password"
          root_password_file="$RUNNER_TEMP/mysql-root-password"
          redis_password_file="$RUNNER_TEMP/redis-password"
          rabbitmq_password_file="$RUNNER_TEMP/rabbitmq-password"
          echo "DATABASE_PASSWORD_FILE=$app_password_file" >> "$GITHUB_ENV"
          echo "COMPOSE_MYSQL_APP_PASSWORD_FILE=$app_password_file" >> "$GITHUB_ENV"
          echo "MYSQL_ROOT_PASSWORD_FILE=$root_password_file" >> "$GITHUB_ENV"
          echo "REDIS_PASSWORD_FILE=$redis_password_file" >> "$GITHUB_ENV"
          echo "COMPOSE_REDIS_PASSWORD_FILE=$redis_password_file" >> "$GITHUB_ENV"
          echo "COMPOSE_RABBITMQ_PASSWORD_FILE=$rabbitmq_password_file" >> "$GITHUB_ENV"
          openssl rand -hex 32 > "$app_password_file"
          openssl rand -hex 32 > "$root_password_file"
          openssl rand -hex 32 > "$redis_password_file"
          openssl rand -hex 32 > "$rabbitmq_password_file"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start backing services
        run: docker compose up --detach --wait --wait-timeout 120 mysql redis rabbitmq

      - name: Apply committed migrations twice
        run: |
          pnpm db:migrate:deploy
          pnpm db:migrate:deploy

      - name: Test database integration
        run: pnpm test:integration:database

      - name: Test API integration
        run: pnpm test:integration:api

      - name: Verify RabbitMQ is ready
        run: docker compose exec -T rabbitmq rabbitmq-diagnostics -q check_running

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color mysql redis rabbitmq

      - name: Remove ephemeral services
        if: always()
        run: docker compose down --volumes --remove-orphans

  container-smoke:
    name: Production container smoke test
    needs:
      - quality
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Create ephemeral service secrets
        shell: bash
        run: |
          umask 077
          mkdir -p .local/secrets
          openssl rand -hex 32 > .local/secrets/mysql-app-password
          openssl rand -hex 32 > .local/secrets/mysql-root-password
          openssl rand -hex 32 > .local/secrets/redis-app-password
          openssl rand -hex 32 > .local/secrets/rabbitmq-password

      - name: Build and start complete stack
        run: docker compose up --detach --build --wait --wait-timeout 180

      - name: Verify complete showcase workflow
        run: node scripts/smoke-showcase.mjs

      - name: Print stack logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Remove complete stack
        if: always()
        run: docker compose down --volumes --remove-orphans
