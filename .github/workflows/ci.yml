name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          cache: true
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit:dependencies

      - name: Run quality gates
        run: pnpm check

  database-integration:
    name: Database integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_PORT: 33060

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          cache: true
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create ephemeral database secrets
        shell: bash
        run: |
          umask 077
          app_password_file="$RUNNER_TEMP/mysql-app-password"
          root_password_file="$RUNNER_TEMP/mysql-root-password"
          echo "DATABASE_PASSWORD_FILE=$app_password_file" >> "$GITHUB_ENV"
          echo "COMPOSE_MYSQL_APP_PASSWORD_FILE=$app_password_file" >> "$GITHUB_ENV"
          echo "MYSQL_ROOT_PASSWORD_FILE=$root_password_file" >> "$GITHUB_ENV"
          openssl rand -hex 32 > "$app_password_file"
          openssl rand -hex 32 > "$root_password_file"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start MySQL
        run: docker compose up --detach --wait --wait-timeout 120 mysql

      - name: Verify MySQL contract
        run: |
          docker compose exec -T mysql sh -euc '
            actual="$(
              MYSQL_PWD="$(cat /run/secrets/mysql_app_password)" \
                mysql --batch --skip-column-names --protocol=TCP \
                --host=127.0.0.1 --user="$MYSQL_USER" \
                --database="$MYSQL_DATABASE" \
                --execute="SELECT VERSION(), @@SESSION.transaction_isolation, @@SESSION.time_zone, @@character_set_server, @@collation_server, DATABASE();"
            )"
            expected="$(printf "8.4.11\tREAD-COMMITTED\t+00:00\tutf8mb4\tutf8mb4_0900_ai_ci\toms")"
            test "$actual" = "$expected"
          '

      - name: Validate Prisma schema
        run: pnpm db:schema:validate

      - name: Apply committed migrations
        run: pnpm db:migrate:deploy

      - name: Verify migration deployment is idempotent
        run: pnpm db:migrate:deploy

      - name: Test Prisma against MySQL
        run: pnpm test:integration:database

      - name: Verify Identity refresh-lineage migration
        run: pnpm test:integration:identity-refresh-lineage

      - name: Verify Identity authorization and security-event migration
        run: pnpm test:integration:identity-authorization

      - name: Test Identity access authority against MySQL
        run: pnpm test:integration:identity-authority

      - name: Test Identity refresh discovery against MySQL
        run: pnpm test:integration:identity-refresh-discovery

      - name: Test Identity refresh locked loader against MySQL
        run: pnpm test:integration:identity-refresh-locked-loader

      - name: Test Catalog vertical read slice against MySQL
        run: pnpm test:integration:catalog

      - name: Test API health against MySQL
        run: pnpm test:integration:api

      - name: Print MySQL logs on failure
        if: failure()
        run: docker compose logs --no-color mysql

      - name: Remove ephemeral database
        if: always()
        run: docker compose down --volumes --remove-orphans

  redis-integration:
    name: Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 63790
      REDIS_USERNAME: oms_app
      REDIS_TLS_MODE: disabled

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          cache: true
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create ephemeral Redis secret
        shell: bash
        run: |
          umask 077
          password_file="$RUNNER_TEMP/redis-password"
          echo "REDIS_PASSWORD_FILE=$password_file" >> "$GITHUB_ENV"
          echo "COMPOSE_REDIS_PASSWORD_FILE=$password_file" >> "$GITHUB_ENV"
          openssl rand -hex 32 > "$password_file"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start Redis
        run: docker compose up --detach --wait --wait-timeout 60 redis

      - name: Verify Redis contract
        run: |
          docker compose exec -T redis sh -euc '
            redis-server --version | grep -q "v=7.2.16"

            redis_command() {
              REDISCLI_AUTH="$(cat /run/secrets/redis_password)" \
                redis-cli --user oms_app --no-auth-warning --raw "$@"
            }

            test "$(redis_command ping)" = "PONG"
            test "$(redis_command set oms:ci:contract ready PX 60000)" = "OK"
            test "$(redis_command get oms:ci:contract)" = "ready"

            demoted_health="$({
              setpriv --reuid redis --regid redis --clear-groups \
                sh -ec '
                  test "$(id -u):$(id -g)" = "999:1000"
                  redis-cli --raw ping 2>&1 \
                    | grep -qx "NOAUTH Authentication required."
                  printf "%s" "healthy"
                '
            } 2>&1 || true)"
            test "$demoted_health" = "healthy"

            unauthenticated="$(redis-cli --raw ping 2>&1 || true)"
            case "$unauthenticated" in
              *NOAUTH*) ;;
              *) printf "%s\n" "Redis accepted an unauthenticated command." >&2; exit 1 ;;
            esac

            outside_namespace="$(redis_command set outside:ci:contract denied 2>&1 || true)"
            case "$outside_namespace" in
              *NOPERM*) ;;
              *) printf "%s\n" "Redis accepted a key outside the oms namespace." >&2; exit 1 ;;
            esac

            extra_command="$(redis_command incr oms:ci:contract 2>&1 || true)"
            case "$extra_command" in
              *NOPERM*) ;;
              *) printf "%s\n" "Redis accepted a command outside the application ACL." >&2; exit 1 ;;
            esac

            test "$(redis_command del oms:ci:contract)" = "1"

            test "$(cat /proc/1/comm)" = "redis-server"
            set -- $(grep ^Uid: /proc/1/status)
            test "$2:$3:$4:$5" = "999:999:999:999"
            set -- $(grep ^Gid: /proc/1/status)
            test "$2:$3:$4:$5" = "1000:1000:1000:1000"
            set -- $(grep ^CapInh: /proc/1/status)
            test "$2" = "0000000000000000"
            set -- $(grep ^CapPrm: /proc/1/status)
            test "$2" = "0000000000000000"
            set -- $(grep ^CapEff: /proc/1/status)
            test "$2" = "0000000000000000"
            set -- $(grep ^CapAmb: /proc/1/status)
            test "$2" = "0000000000000000"
            set -- $(grep ^NoNewPrivs: /proc/1/status)
            test "$2" = "1"
          '

      - name: Test Redis runtime
        run: pnpm test:integration:redis

      - name: Test Identity refresh abuse control against Redis
        run: pnpm test:integration:identity-refresh-abuse

      - name: Print Redis logs on failure
        if: failure()
        run: docker compose logs --no-color redis

      - name: Remove ephemeral Redis
        if: always()
        run: docker compose down --volumes --remove-orphans
